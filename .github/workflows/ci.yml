name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支上新的推送取消旧的跑
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # 解决方案与各项目都在 src/ 下，run 步骤以此为工作目录
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      # 仓库 global.json 只选了 MTP 测试 runner（test.runner），没钉 SDK 版本
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 缓存 NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 还原
        run: dotnet restore UiharuMind.sln

      # axaml 的命名空间与 x:Class 错误在这里炸（AVLN2000）
      - name: 构建
        run: dotnet build UiharuMind.sln --configuration Release --no-restore

      # 本仓测试走 MTP（Microsoft.Testing.Platform），判成败用 dotnet msbuild -t:Test。
      # 别用 dotnet test —— SDK 10.0.401 下它会静默跑出零个测试；dotnet msbuild 没有 --no-restore
      - name: Core 测试
        run: dotnet msbuild UiharuMind.Core.Tests/UiharuMind.Core.Tests.csproj -t:Test -p:Configuration=Release

      - name: App 测试
        run: dotnet msbuild UiharuMind.App.Tests/UiharuMind.App.Tests.csproj -t:Test -p:Configuration=Release
