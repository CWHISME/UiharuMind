<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Canvas Demo</title>
</head>
<body>
<canvas id="c" width="500" height="300"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let clicked = false;

function draw() {
  ctx.fillStyle = '#f5f5f5';
  ctx.fillRect(0, 0, 500, 300);
  ctx.fillStyle = '#333';
  ctx.font = '20px sans-serif';
  ctx.fillText('canvas-demo-1', 30, 40);
  ctx.fillStyle = '#4a90d9';
  ctx.fillRect(150, 120, 180, 60);
  ctx.fillStyle = '#fff';
  ctx.font = '18px sans-serif';
  ctx.fillText('点击我', 205, 158);
  ctx.fillStyle = '#333';
  ctx.font = '16px sans-serif';
  ctx.fillText(clicked ? '已点击' : '未点击', 30, 240);
}

cv.addEventListener('click', function () { clicked = true; draw(); });
draw();
</script>
</body>
</html>
